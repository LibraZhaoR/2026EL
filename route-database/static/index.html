<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵动金陵 · 路线规划</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- 侧边栏 -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h1>🗺️ 灵动金陵</h1>
    <span class="subtitle">路线数据库 · 地图规划</span>
  </div>

  <div id="sidebar-tabs">
    <button class="tab active" data-tab="list">📋 路线列表</button>
    <button class="tab" data-tab="create">✏️ 创建路线</button>
    <button class="tab" data-tab="detail" style="display:none" id="tab-detail">📍 路线详情</button>
  </div>

  <!-- 路线列表面板 -->
  <div id="panel-list" class="panel">
    <div class="filter-row">
      <input type="text" id="search-input" placeholder="🔍 搜索路线..." />
      <select id="filter-category">
        <option value="">全部分类</option>
        <option value="文化">文化</option>
        <option value="生活">生活</option>
        <option value="美食">美食</option>
        <option value="自定义">自定义</option>
      </select>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="official">官方</button>
      <button class="filter-btn" data-filter="user">用户</button>
    </div>
    <div id="route-list"></div>
  </div>

  <!-- 创建路线面板 -->
  <div id="panel-create" class="panel" style="display:none">
    <form id="create-form">
      <label>路线名称 *</label>
      <input type="text" id="create-title" placeholder="给你的路线起个名字" required />

      <label>描述</label>
      <textarea id="create-desc" rows="3" placeholder="描述这条路线的特色..."></textarea>

      <div class="form-row">
        <div class="form-col">
          <label>分类</label>
          <select id="create-category">
            <option>文化</option><option>生活</option><option>美食</option><option>自定义</option>
          </select>
        </div>
        <div class="form-col">
          <label>预估时长(分钟)</label>
          <input type="number" id="create-duration" value="120" min="0" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label>最低预算 ¥</label>
          <input type="number" id="create-budget-min" value="0" min="0" step="0.01" />
        </div>
        <div class="form-col">
          <label>最高预算 ¥</label>
          <input type="number" id="create-budget-max" value="200" min="0" step="0.01" />
        </div>
      </div>

      <label>适合人群 (逗号分隔)</label>
      <input type="text" id="create-crowd" placeholder="情侣, 朋友, 一个人" />

      <label>兴趣标签 (逗号分隔)</label>
      <input type="text" id="create-tags" placeholder="美食, 拍照, 历史" />

      <label>是否公开</label>
      <label class="switch-label">
        <input type="checkbox" id="create-public" checked /> 公开这条路线
      </label>

      <div class="map-tip">
        💡 <strong>在地图上点击</strong>添加路线点位。起点→途径点→终点按点击顺序排列。
        右键点击标记可删除。
      </div>

      <div id="point-list"></div>

      <button type="submit" class="btn-primary">💾 保存路线</button>
    </form>
  </div>

  <!-- 路线详情面板 -->
  <div id="panel-detail" class="panel" style="display:none">
    <div id="detail-content"></div>
    <div id="meituan-section">
      <div id="meituan-header" class="meituan-header">
        <span class="meituan-title">🍊 附近美团商户</span>
        <span class="meituan-arrow">▾</span>
      </div>
      <div id="meituan-body" class="meituan-body" style="display:none"></div>
    </div>
  </div>
</aside>

<!-- 地图 -->
<main id="map"></main>

<!-- 模式指示器 -->
<div id="mode-indicator" style="display:none">
  <span id="mode-text"></span>
  <button id="mode-cancel">取消</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./meituan-data.js"></script>
<script src="./app.js"></script>
</body>
</html>
