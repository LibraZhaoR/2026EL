server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-nanjing-travel

travel:
  ai:
    # 可选: mock(离线关键词回复) | doubao(火山引擎豆包,需配API_KEY)
    provider: mock
    base-url: https://ark.cn-beijing.volces.com/api/v3/responses
    # 环境变量 AI_API_KEY 设置火山引擎 API Key
    # 或直接替换下方 your-api-key-here
    api-key: ${AI_API_KEY:your-api-key-here}
    model: doubao-seed-1-6
  meituan:
    enabled: false
    developer-id: ""
    sign-key: ${MEITUAN_SIGN_KEY:your-sign-key-here}
    base-url: https://api-open-cater.meituan.com
  share:
    base-url: https://example.com/invite/
