<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>南京城市手绘卷轴</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ═══ 主 App · 路线探索界面 ═══ -->
<div class="app-root" id="app-root">
    <!-- Opening overlay — click to dismiss -->
    <section class="opening" id="opening">
        <h1>南京，<br>今天去哪儿？</h1>
        <p>从一幅水墨开始。</p>
    </section>

    <div class="stage" id="stage">
        <canvas id="landscape-canvas"></canvas>
        <div class="poem-stage" id="poem-stage">
            <div class="poem poem-left-top" data-scene="0">
                <h2>从一棵梧桐开始，<br>今天的南京慢慢展开。</h2>
            </div>
            <div class="poem poem-left-top" data-scene="1">
                <h2>有些路，<br>从一座校园开始。</h2>
                <button class="enter" data-route="nju">南大校史线</button>
            </div>
            <div class="poem poem-left-top" data-scene="2">
                <h2>夜色落下时，<br>秦淮河会替你点亮一条路。</h2>
                <button class="enter" data-route="night">秦淮夜游</button>
            </div>
            <div class="poem poem-left-top" data-scene="3">
                <h2>烟火气藏在巷口，<br>也藏在一顿刚好的晚饭里。</h2>
                <button class="enter" data-route="food">美食路线</button>
            </div>
            <div class="poem poem-left-top" data-scene="4">
                <h2>如果今天想安静一点，<br>就去和一件旧物对话。</h2>
                <button class="enter" data-route="expo">展览路线</button>
            </div>
        </div>
        <div class="dots" id="dots">
            <i data-dot="0"></i>
            <i data-dot="1"></i>
            <i data-dot="2"></i>
            <i data-dot="3"></i>
            <i data-dot="4"></i>
        </div>
    </div>
</div>

<!-- ═══ 今日路线画像 · 高密度选择工具 ═══ -->
<section class="persona-page" id="persona-page">
    <canvas class="persona-bg" id="persona-bg"></canvas>

    <!-- Sticky top: header + all filter chips -->
    <div class="preference-top" id="preference-top">
        <header class="persona-header">
            <p class="eyebrow">今日路线画像</p>
            <h1>今天想怎么打开南京？</h1>
        </header>
        <div class="filter-rows" id="filter-rows"></div>
    </div>

    <!-- Accordion interest section -->
    <p class="section-label">选择兴趣</p>
    <section class="interest-section" id="interest-section"></section>

    <!-- Selected tags -->
    <div class="selected-area" id="selected-area">
        <p class="selected-label">已入卷</p>
        <div class="selected-tags" id="selected-tags"></div>
    </div>

    <!-- Route sign -->
    <section class="route-sign" id="route-sign">
        <p class="sign-eyebrow">今日路线签</p>
        <h3 id="sign-title">漫步南京</h3>
        <p class="sign-desc" id="sign-desc">选择一些关键词，组合你的今日路线。</p>
        <p class="sign-meta" id="sign-meta"></p>
    </section>

    <!-- Bottom actions -->
    <footer class="persona-actions">
        <button class="primary-start" id="persona-start">进入App</button>
        <button class="skip-persona" id="persona-skip">跳过，直接进入首页</button>
    </footer>
</section>

<!-- ═══ 路线详情弹窗 ═══ -->
<div class="route-sheet" id="route-sheet">
    <div class="sheet-mask"></div>
    <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="./app.js"></script>

</body>
</html>
