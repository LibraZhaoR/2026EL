<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京城市手绘卷轴 · 移动端演示</title>
<style>
  /* ═══ Reset ═══ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #1a1a1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ Background ═══ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(182,66,54,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(78,126,122,0.08), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(216,168,74,0.04), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ═══ Page Layout ═══ */
  .demo-page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    min-height: 100vh;
    width: 100%;
  }

  /* ═══ Header ═══ */
  .demo-header {
    text-align: center;
    margin-bottom: 28px;
    max-width: 700px;
  }
  .demo-header h1 {
    font-family: "Noto Serif SC", "STSong", "SimSun", serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.06em;
    background: linear-gradient(135deg, #f0ebe0, #d8a94a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .demo-header p {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.08em;
  }

  /* ═══ Phone Frame ═══ */
  .phone-wrapper {
    position: relative;
    flex-shrink: 0;
  }

  .phone-frame {
    position: relative;
    width: 375px;
    height: 812px;
    border-radius: 48px;
    background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
    padding: 12px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 30px 80px rgba(0,0,0,0.6),
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* Phone inner screen */
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: #FCFCFB;
    position: relative;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 32px;
    background: #111;
    border-radius: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
  }
  .dynamic-island .cam {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a3a, #0a0a0a);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .dynamic-island .sensor {
    width: 30px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
  }

  /* Status bar overlay */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 99;
    height: 48px;
    padding: 12px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: rgba(0,0,0,0.6);
    font-size: 11px;
    font-weight: 600;
  }
  .status-bar .time { font-size: 13px; font-weight: 700; }
  .status-bar .icons { display: flex; gap: 4px; font-size: 11px; }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(0,0,0,0.15);
    z-index: 99;
    pointer-events: none;
  }

  /* ═══ Iframe ═══ */
  .phone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ═══ Sidebar Info ═══ */
  .demo-sidebar {
    max-width: 300px;
    margin-top: 30px;
    text-align: center;
  }
  .demo-sidebar .feature-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .demo-sidebar .feature-tag {
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }
  .demo-sidebar .feature-tag:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .demo-sidebar .instructions {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    line-height: 1.6;
    letter-spacing: 0.03em;
  }
  .demo-sidebar .instructions span {
    color: rgba(255,255,255,0.5);
  }

  /* ═══ Controls ═══ */
  .demo-controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .demo-controls button {
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .demo-controls button:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  .demo-controls button:active {
    transform: scale(0.95);
  }
  .demo-controls button.primary {
    background: rgba(182,66,54,0.3);
    border-color: rgba(182,66,54,0.3);
    color: #fff;
  }
  .demo-controls button.primary:hover {
    background: rgba(182,66,54,0.5);
  }

  /* ═══ Loading Overlay ═══ */
  .loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #FCFCFB;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
    border-radius: 38px;
  }
  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-overlay .loader-icon {
    font-size: 36px;
    margin-bottom: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .loading-overlay .loader-text {
    font-size: 13px;
    color: rgba(31,35,32,0.4);
    letter-spacing: 0.06em;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  /* ═══ Error state ═══ */
  .error-overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #FCFCFB;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    border-radius: 38px;
  }
  .error-overlay.show { display: flex; }
  .error-overlay .err-icon { font-size: 40px; margin-bottom: 12px; }
  .error-overlay .err-text { font-size: 14px; color: rgba(31,35,32,0.5); line-height: 1.6; }

  /* ═══ Responsive ═══ */
  @media (max-width: 480px) {
    .demo-page { padding: 12px; justify-content: flex-start; }
    .demo-header h1 { font-size: 20px; }
    .demo-header { margin-bottom: 16px; }
    .phone-frame {
      width: 100%;
      height: auto;
      aspect-ratio: 375 / 812;
      max-height: 80vh;
      padding: 8px;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .phone-screen { border-radius: 26px; }
    .dynamic-island { width: 90px; height: 26px; top: 8px; }
    .dynamic-island .sensor { width: 20px; }
    .status-bar { font-size: 10px; height: 40px; padding: 10px 18px 0; }
    .status-bar .time { font-size: 12px; }
    .home-indicator { width: 100px; height: 4px; bottom: 6px; }
    .demo-sidebar { margin-top: 20px; }
    .loading-overlay .loader-icon { font-size: 28px; }
    .error-overlay .err-icon { font-size: 32px; }
  }

  @media (max-width: 380px) {
    .phone-frame { border-radius: 24px; padding: 6px; }
    .phone-screen { border-radius: 20px; }
  }
</style>
</head>
<body>
<div class="demo-page">

  <!-- ═══ Header ═══ -->
  <header class="demo-header">
    <h1>南京城市手绘卷轴</h1>
    <p>— 移动端交互演示 —</p>
  </header>

  <!-- ═══ Phone + Sidebar Container ═══ -->
  <div class="phone-wrapper">
    <div class="phone-frame">
      <div class="phone-screen" id="phoneScreen">
        <!-- Dynamic Island -->
        <div class="dynamic-island">
          <div class="cam"></div>
          <div class="sensor"></div>
        </div>
        <!-- Status Bar -->
        <div class="status-bar">
          <span class="time" id="statusTime">9:41</span>
          <span class="icons">📶 📶 🔋</span>
        </div>
        <!-- Home Indicator -->
        <div class="home-indicator"></div>

        <!-- Iframe: loads the actual app -->
        <iframe id="appIframe"
          src="/app/index.html"
          allow="geolocation; clipboard-read; clipboard-write"
          loading="lazy"
          title="南京城市手绘卷轴"
          onload="onIframeLoad()">
        </iframe>

        <!-- Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loader-icon">🏮</div>
          <div class="loader-text">加载应用中…</div>
        </div>

        <!-- Error -->
        <div class="error-overlay" id="errorOverlay">
          <div class="err-icon">⚠️</div>
          <div class="err-text">
            应用未启动或连接失败<br>
            <small>请确保后端服务已启动</small>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══ Controls ═══ -->
    <div class="demo-controls">
      <button class="primary" onclick="refreshApp()">🔄 刷新应用</button>
      <button onclick="toggleFullscreen()">📱 全屏模式</button>
      <button onclick="openInNewTab()">↗ 新窗口打开</button>
    </div>
  </div>

  <!-- ═══ Sidebar Info ═══ -->
  <aside class="demo-sidebar">
    <div class="feature-list">
      <span class="feature-tag">🎨 手绘水墨开屏</span>
      <span class="feature-tag">🧑‍🎨 8种人格选择</span>
      <span class="feature-tag">🗺 高德地图集成</span>
      <span class="feature-tag">📍 4条精品路线</span>
      <span class="feature-tag">📖 剧情节点故事</span>
      <span class="feature-tag">📮 路线邀约卡</span>
      <span class="feature-tag">📋 路线复刻</span>
      <span class="feature-tag">🏆 成就系统</span>
    </div>
    <div class="instructions">
      <span>💡</span> 在手机框内点击操作 · 推荐使用 Chrome 开发者工具模拟移动设备查看
    </div>
  </aside>
</div>

<script>
  // ── Update status bar time ──
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("statusTime").textContent = h + ":" + m;
  }
  updateTime();
  setInterval(updateTime, 10000);

  // ── Iframe load handling ──
  var loadingTimer = null;

  function onIframeLoad() {
    clearTimeout(loadingTimer);
    document.getElementById("loadingOverlay").classList.add("hidden");
    document.getElementById("errorOverlay").classList.remove("show");
  }

  // Show loading on load start, error if timeout
  function refreshApp() {
    var iframe = document.getElementById("appIframe");
    var loading = document.getElementById("loadingOverlay");
    var error = document.getElementById("errorOverlay");

    loading.classList.remove("hidden");
    error.classList.remove("show");

    // Force reload
    iframe.src = "/app/index.html?_t=" + Date.now();

    // Error timeout
    clearTimeout(loadingTimer);
    loadingTimer = setTimeout(function() {
      if (!loading.classList.contains("hidden")) {
        loading.classList.add("hidden");
        error.classList.add("show");
      }
    }, 15000);
  }

  // ── Fullscreen mode (hide phone frame, show raw app) ──
  var isFullscreen = false;

  function toggleFullscreen() {
    isFullscreen = !isFullscreen;
    var frame = document.querySelector(".phone-frame");
    var sidebar = document.querySelector(".demo-sidebar");
    var header = document.querySelector(".demo-header");
    var controls = document.querySelector(".demo-controls");

    if (isFullscreen) {
      frame.style.width = "100%";
      frame.style.maxWidth = "100%";
      frame.style.height = "calc(100vh - 40px)";
      frame.style.borderRadius = "0";
      frame.style.boxShadow = "none";
      frame.style.padding = "0";
      frame.style.background = "transparent";
      document.querySelector(".phone-screen").style.borderRadius = "0";
      document.querySelector(".dynamic-island").style.display = "none";
      document.querySelector(".status-bar").style.display = "none";
      document.querySelector(".home-indicator").style.display = "none";
      if (sidebar) sidebar.style.display = "none";
      if (header) header.style.display = "none";
      if (controls) controls.style.display = "none";
      document.body.style.background = "#FCFCFB";
      document.querySelector(".demo-page").style.padding = "0";
      document.querySelector(".demo-page").style.justifyContent = "flex-start";
      document.querySelector(".phone-wrapper").style.width = "100%";
      document.querySelector(".phone-wrapper").style.maxWidth = "100%";
    } else {
      frame.style.width = "";
      frame.style.maxWidth = "";
      frame.style.height = "";
      frame.style.borderRadius = "";
      frame.style.boxShadow = "";
      frame.style.padding = "";
      frame.style.background = "";
      document.querySelector(".phone-screen").style.borderRadius = "";
      document.querySelector(".dynamic-island").style.display = "";
      document.querySelector(".status-bar").style.display = "";
      document.querySelector(".home-indicator").style.display = "";
      if (sidebar) sidebar.style.display = "";
      if (header) header.style.display = "";
      if (controls) controls.style.display = "";
      document.body.style.background = "";
      document.querySelector(".demo-page").style.padding = "";
      document.querySelector(".demo-page").style.justifyContent = "";
      document.querySelector(".phone-wrapper").style.width = "";
      document.querySelector(".phone-wrapper").style.maxWidth = "";
    }
  }

  // ── Open in new tab ──
  function openInNewTab() {
    window.open("/app/index.html", "_blank");
  }

  // ── Auto-reload on error ──
  document.addEventListener("DOMContentLoaded", function() {
    loadingTimer = setTimeout(function() {
      var loading = document.getElementById("loadingOverlay");
      if (!loading.classList.contains("hidden")) {
        loading.classList.add("hidden");
        document.getElementById("errorOverlay").classList.add("show");
      }
    }, 15000);
  });
</script>

</body>
</html>
