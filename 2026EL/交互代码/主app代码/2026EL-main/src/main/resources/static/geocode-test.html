<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Geocode Test</title>
<style>body{background:#111;color:#fff;font:14px monospace;padding:20px;}pre{color:#0f0;}</style>
</head>
<body><h2>Geocode Test</h2><pre id="log"></pre>
<script>
var el=document.getElementById('log');
function L(s){el.textContent+=s+'\n';}

L('Step 1: Loading AMap...');
AMapLoader.load({
  key:'acbce3442afa6bf6251bc8014a1594b8',
  version:'2.0',
  plugins:[]
}).then(function(AMap){
  L('Step 2: AMap loaded. Checking Geocoder...');
  L('  typeof AMap.Geocoder = '+typeof AMap.Geocoder);
  L('  AMap.Geocoder keys = '+Object.keys(AMap.Geocoder||{}).join(','));

  L('Step 3: Creating Geocoder...');
  try {
    var g = new AMap.Geocoder({city:'南京'});
    L('  Created OK!');
    L('  Methods: '+Object.keys(g).join(','));

    L('Step 4: Testing getLocation...');
    // Try callback style
    g.getLocation('夫子庙 南京', function(status, result){
      L('  Callback style: status='+status+', result='+JSON.stringify(result).substring(0,200));
    });

    // Try promise style
    try {
      var p = g.getLocation('中山陵 南京');
      if(p && p.then) {
        p.then(function(r){
          L('  Promise style: OK, result='+JSON.stringify(r).substring(0,200));
        }).catch(function(e){
          L('  Promise style: ERROR='+e.message);
        });
      } else {
        L('  Promise style: returned '+typeof p);
      }
    } catch(e){
      L('  Promise style threw: '+e.message);
    }

  } catch(e){
    L('  ERROR creating Geocoder: '+e.message);
  }
}).catch(function(e){
  L('AMap load FAILED: '+e.message);
});
</script>
<script src="https://webapi.amap.com/loader.js"></script>
</body>
</html>
