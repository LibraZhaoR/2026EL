<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>Geocode Batch</title>
<style>
body { background:#1a1a1a; color:#fff; font:14px/1.5 monospace; padding:20px; }
h2 { color:#ff0; }
pre { background:#111; color:#0f0; padding:16px; max-height:70vh; overflow:auto; white-space:pre-wrap; }
.fail { color:#f66; }
.warn { color:#fa0; }
</style>
</head>
<body>
<h2>AMap Geocode Batch - <span id="prog"></span></h2>
<pre id="out"></pre>
<script>
var out = document.getElementById('out');
var prog = document.getElementById('prog');

function log(s, cls) {
  out.innerHTML += (cls ? '<span class="'+cls+'">' : '') + s + (cls ? '</span>' : '') + '\n';
  out.scrollTop = out.scrollHeight;
}

function waitForLoader(cb) {
  if (typeof AMapLoader !== 'undefined') { cb(); return; }
  log('Waiting for AMapLoader...', 'warn');
  setTimeout(function() { waitForLoader(cb); }, 300);
}

waitForLoader(function() {
  log('AMapLoader found. Loading AMap + Geocoder plugin...');
  AMapLoader.load({
    key: 'acbce3442afa6bf6251bc8014a1594b8',
    version: '2.0',
    plugins: ['AMap.Geocoder']
  }).then(function(AMap) {
    log('AMap loaded. Checking Geocoder...');
    log('AMap.Geocoder exists: ' + (typeof AMap.Geocoder));
    log('AMap.Geocoder: ' + JSON.stringify(Object.keys(AMap.Geocoder || {})));

    if (typeof AMap.Geocoder !== 'function') {
      log('ERROR: AMap.Geocoder not available! Plugin may have failed to load.', 'fail');
      log('Available AMap keys: ' + Object.keys(AMap).join(', '));
      return;
    }

    log('Creating Geocoder instance...');
    var geocoder;
    try {
      geocoder = new AMap.Geocoder({ city: '南京', batch: false });
      log('Geocoder created OK. Type: ' + typeof geocoder);
      log('Geocoder methods: ' + Object.keys(geocoder).join(', '));
    } catch(e) {
      log('ERROR creating Geocoder: ' + e.message, 'fail');
      return;
    }

    var names = [
      "台城（解放门段）","明城墙全线","夫子庙","王谢古居","甘熙宅第",
      "李香君故居","颜鲁公祠","老门东","颐和路民国公馆区","熙南里",
      "高淳老街","浦口火车站街区","下关街道","瞻园","煦园(总统府内)",
      "愚园(胡家花园)","白鹭洲公园","玄武湖公园(五洲)","明故宫遗址","石头城遗址",
      "六朝建康城遗址","南唐二陵","明孝陵","中山陵","灵谷寺",
      "南京博物院","朝天宫","六朝博物馆","江宁织造博物馆","南京城墙博物馆",
      "南京地质博物馆","南京民俗博物馆","南京古生物博物馆","科举博物馆","江苏省美术馆",
      "金陵美术馆","四方当代美术馆","侵华日军南京大屠杀遇难同胞纪念馆",
      "渡江胜利纪念馆","梅园新村纪念馆","雨花台烈士纪念馆",
      "石鼓路天主教堂","莫愁路基督教堂","圣保罗教堂","鸡鸣寺","毗卢寺",
      "栖霞寺","清凉寺","南京奥体中心","五台山体育中心","青奥体育公园",
      "南京图书馆","金陵图书馆","南京大学杜厦图书馆","南京市工人文化宫",
      "南京人民大会堂","江苏省美术馆老馆","南京市政府","鼓楼市民广场",
      "南京站","南京南站","中山码头","南京禄口国际机场","南京长江大桥",
      "南京眼步行桥","紫峰大厦","牛首山佛顶宫","大报恩寺琉璃塔",
      "青奥中心(双子塔)","江苏大剧院","金陵饭店","四方当代美术馆建筑群",
      "鼓楼广场","南京国际青年文化中心(双子塔)"
    ];

    var results = {};
    var failed = [];

    function tryGeocode(name, callback) {
      // Try Promise-based API first (AMap v2.0)
      log('  Trying getLocation for: ' + name + ' 南京');
      var promiseResult = null;
      try {
        var promise = geocoder.getLocation(name + ' 南京');
        if (promise && typeof promise.then === 'function') {
          promise.then(function(result) {
            log('  Promise resolved: ' + JSON.stringify(result).substring(0, 200));
            callback(null, result);
          }).catch(function(err) {
            log('  Promise rejected: ' + (err && err.message || err));
            callback(err);
          });
          return;
        }
      } catch(e) {
        log('  Promise approach threw: ' + e.message);
      }
      // Fallback: callback-based API
      log('  Trying callback-based API...');
      geocoder.getLocation(name + ' 南京', function(status, result) {
        log('  Callback fired: status=' + status + ', result=' + JSON.stringify(result).substring(0, 200));
        if (status === 'complete' && result && result.info === 'OK') {
          callback(null, result);
        } else {
          callback(new Error('Status: ' + status + ' Info: ' + (result && result.info)));
        }
      });
    }

    function next(i) {
      if (i >= names.length) {
        log('\n=== DONE ===');
        log('OK: ' + (names.length - failed.length) + '/' + names.length);
        if (failed.length) log('FAILED: ' + failed.join(', '), 'fail');
        log('\n--- JSON OUTPUT ---');
        log(JSON.stringify(results));
        return;
      }

      var name = names[i];
      prog.textContent = '[' + (i+1) + '/' + names.length + ']';

      tryGeocode(name, function(err, result) {
        if (!err && result && result.geocodes && result.geocodes.length > 0) {
          var loc = result.geocodes[0].location;
          results[name] = [Number(loc.lng), Number(loc.lat)];
          log('OK  ' + name + ' -> [' + results[name][0].toFixed(6) + ', ' + results[name][1].toFixed(6) + ']');
        } else {
          results[name] = null;
          failed.push(name);
          log('FAIL ' + name + (err ? ' (' + err.message + ')' : ''), 'fail');
        }
        setTimeout(function() { next(i + 1); }, 250);
      });
    }

    log('\nStarting batch geocoding of ' + names.length + ' landmarks...\n');
    // Test first one
    log('--- Testing first landmark ---');
    tryGeocode(names[0], function(err, result) {
      if (err || !result) {
        log('Test failed. Aborting.', 'fail');
        return;
      }
      var loc = result.geocodes[0].location;
      results[names[0]] = [Number(loc.lng), Number(loc.lat)];
      log('Test OK! ' + names[0] + ' -> [' + results[names[0]][0] + ', ' + results[names[0]][1] + ']');
      log('--- Continuing batch ---');
      setTimeout(function() { next(1); }, 250);
    });

  }).catch(function(e) {
    log('AMapLoader.load FAILED: ' + (e && e.message || e), 'fail');
  });
});
</script>
<script src="https://webapi.amap.com/loader.js"></script>
</body>
</html>
