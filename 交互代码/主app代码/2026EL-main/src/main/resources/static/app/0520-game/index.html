<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南小鲸·金陵鲸梦</title>
<link rel="stylesheet" href="style/main.css">
</head>
<body>

<!-- 点击启动画面（解锁音频 + 开始游戏） -->
<div id="vn-start-screen">
  <div id="vn-start-inner">
    <h1 id="vn-start-title">南小鲸·金陵鲸梦</h1>
    <p id="vn-start-subtitle">—— 致每一个曾在梧桐树下走过的人</p>
    <p id="vn-start-hint">点击屏幕开始</p>
  </div>
</div>

<!-- 视觉小说舞台 -->
<div id="vn-stage">
  <!-- 退出按钮 -->
  <button id="vn-exit-btn" title="返回主应用">✕</button>
  <!-- 背景图层 -->
  <div id="vn-background"></div>

  <!-- 角色立绘层 -->
  <div id="vn-sprites"></div>

  <!-- 对话框区域 -->
  <div id="vn-dialog-box">
    <div id="vn-speaker-name"></div>
    <div id="vn-dialog-text"></div>
    <div id="vn-click-hint">&#x25BC; 点击继续</div>
  </div>

  <!-- 选项菜单 -->
  <div id="vn-choices"></div>
</div>

<!-- 引擎核心 -->
<script src="engine/vn-engine.js"></script>
<!-- 游戏配置：角色、背景、资源定义 -->
<script src="game/main.js"></script>
<!-- 游戏脚本：全部剧情内容 -->
<script src="game/script.js"></script>

<script>
// 启动画面点击 → 解锁音频 + 开始游戏
document.getElementById('vn-start-screen').addEventListener('click', function() {
  this.classList.add('hidden');
  VNEngine.start('start');
});

// 退出按钮 → 关闭当前页签，回到主应用
document.getElementById('vn-exit-btn').addEventListener('click', function() {
  window.close();
});
</script>

</body>
</html>
