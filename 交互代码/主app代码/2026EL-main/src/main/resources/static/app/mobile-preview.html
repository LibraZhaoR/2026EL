<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端预览 — 灵动金陵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .phone-frame {
            width: 390px; height: 844px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 0 6px #333, 0 0 0 8px #555, 0 20px 60px rgba(0,0,0,0.5);
            background: #fff;
            position: relative;
        }
        .phone-frame iframe {
            width: 390px; height: 844px;
            border: none;
        }
        .toolbar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; border-radius: 999px; padding: 8px 20px;
            display: flex; gap: 16px; font-size: 13px; z-index: 10;
        }
        .toolbar button {
            background: #555; color: #fff; border: none; border-radius: 8px; padding: 6px 14px;
            cursor: pointer; font-size: 13px;
        }
        .toolbar button:hover { background: #777; }
        .toolbar select {
            background: #444; color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="phone-frame" id="phone">
        <iframe src="./index.html" id="preview-iframe"></iframe>
    </div>
    <div class="toolbar">
        <span>机型:</span>
        <select id="device-select" onchange="changeDevice()">
            <option value="390,844">iPhone 14 Pro (390×844)</option>
            <option value="375,812">iPhone X (375×812)</option>
            <option value="414,896">iPhone 14 Pro Max (414×896)</option>
            <option value="360,780">Pixel 7 (360×780)</option>
            <option value="412,915">Pixel 7 Pro (412×915)</option>
        </select>
        <button onclick="document.getElementById('preview-iframe').src='./index.html'">刷新</button>
    </div>
    <script>
        function changeDevice() {
            var val = document.getElementById('device-select').value.split(',');
            var w = val[0], h = val[1];
            var frame = document.getElementById('phone');
            frame.style.width = w + 'px';
            frame.style.height = h + 'px';
            document.getElementById('preview-iframe').style.width = w + 'px';
            document.getElementById('preview-iframe').style.height = h + 'px';
        }
    </script>
</body>
</html>
