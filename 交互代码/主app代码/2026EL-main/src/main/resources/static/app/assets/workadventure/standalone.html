<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkAdventure · 南大软院虚拟校园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#app{width:100%;height:100%;display:flex;flex-direction:column}

/* Top bar */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.85);color:#fff;z-index:10;gap:12px;flex-shrink:0}
#topbar h1{font-size:16px;white-space:nowrap}
#topbar .online{display:flex;align-items:center;gap:6px;font-size:13px}
#topbar .online .dot{width:8px;height:8px;background:#4f9d62;border-radius:50%}
#topbar .controls{display:flex;gap:8px}
#topbar button{padding:6px 14px;border:1px solid #555;border-radius:6px;background:#2a2a4a;color:#ddd;cursor:pointer;font-size:12px}
#topbar button:hover{background:#3a3a6a}

/* Game canvas */
#game-container{flex:1;position:relative;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0}

/* Mini map */
#minimap{position:absolute;bottom:16px;right:16px;width:140px;height:100px;border:2px solid rgba(255,255,255,0.3);border-radius:6px;background:rgba(0,0,0,0.6);overflow:hidden}
#minimap canvas{width:100%;height:100%}

/* Bottom bar */
#bottombar{display:flex;align-items:center;padding:6px 16px;background:rgba(0,0,0,0.85);color:#fff;gap:16px;flex-shrink:0;min-height:44px}
#bottombar .hint{font-size:12px;color:#aaa}
#bottombar .status{font-size:12px;color:#4f9d62}
#bottombar .room-name{font-size:13px;font-weight:bold;color:#d69a35;margin-left:auto}

/* Proximity popup */
#proximity-popup{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;border:1px solid #d69a35;border-radius:10px;padding:14px 20px;display:none;z-index:20;text-align:center;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
#proximity-popup.visible{display:block}
#proximity-popup h3{font-size:15px;margin-bottom:4px;color:#d69a35}
#proximity-popup p{font-size:13px;color:#ccc;margin-bottom:10px}
#proximity-popup .actions{display:flex;gap:8px;justify-content:center}
#proximity-popup button{padding:6px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
#proximity-popup .btn-enter{background:#d69a35;color:#000}
#proximity-popup .btn-call{background:#39a3c8;color:#fff}
#proximity-popup .btn-close{background:#555;color:#ccc}

/* Name labels */
.name-tag{position:absolute;color:#fff;font-size:10px;text-align:center;pointer-events:none;text-shadow:1px 1px 2px #000;transform:translate(-50%,-100%);white-space:nowrap}
.name-tag .bubble{position:absolute;background:rgba(255,255,255,0.95);color:#222;border-radius:8px;padding:3px 8px;font-size:9px;max-width:120px;top:-28px;left:50%;transform:translateX(-50%);display:none;white-space:normal;text-shadow:none}
.name-tag.show-bubble .bubble{display:block}

/* Video call indicator */
.video-indicator{position:absolute;width:20px;height:20px;border-radius:50%;background:#39a3c8;border:2px solid #fff;animation:pulse 1.5s infinite;pointer-events:none;transform:translate(-50%,-50%)}
@keyframes pulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}}

/* Room transition overlay */
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;display:none;justify-content:center;align-items:center;flex-direction:column}
#overlay.visible{display:flex}
#overlay .loading{color:#fff;font-size:20px}
#overlay .room-title{color:#d69a35;font-size:28px;margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>WorkAdventure · 南大软院虚拟校园</h1>
    <div class="online"><span class="dot"></span><span id="online-count">12 人在线</span></div>
    <div class="controls">
      <button onclick="toggleMinimap()">小地图</button>
      <button onclick="resetPosition()">重置位置</button>
    </div>
  </div>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
    <div id="proximity-popup">
      <h3 id="popup-title"></h3>
      <p id="popup-desc"></p>
      <div class="actions" id="popup-actions"></div>
    </div>
  </div>
  <div id="bottombar">
    <span class="hint">方向键/WASD 移动 | 靠近人物和房间进行互动</span>
    <span class="status" id="status-text"></span>
    <span class="room-name" id="room-name">📍 软院大厅</span>
  </div>
</div>
<div id="overlay">
  <div class="loading">加载中...</div>
  <div class="room-title" id="overlay-title"></div>
</div>

<script>
// ==================== WorkAdventure 独立游戏引擎 ====================
const TILE = 32;
const COLS = 40;
const ROWS = 30;
const MAP_W = COLS * TILE; // 1280
const MAP_H = ROWS * TILE; // 960

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');

let W, H, minimapVisible = true;

// --- Rooms (WorkAdventure maps) ---
const ROOMS = {
  lobby: {
    name: '软院大厅',
    id: 'lobby',
    buildMap: buildLobby,
    spawn: {x:5*TILE+TILE/2, y:21*TILE+TILE/2},
    zones: [
      {x:2*TILE,y:12*TILE,w:10*TILE,h:6*TILE, type:'meeting', label:'大会议室', desc:'软院全体大会进行中...', action:'join', room:'meeting_hall'},
      {x:24*TILE,y:6*TILE,w:8*TILE,h:6*TILE, type:'lab', label:'软件工程实验室', desc:'张教授的科研组正在讨论论文方向。', action:'join', room:'lab'},
      {x:20*TILE,y:18*TILE,w:8*TILE,h:7*TILE, type:'classroom', label:'创新工坊', desc:'同学们在做大作业项目展示。', action:'call'},
      {x:4*TILE,y:22*TILE,w:6*TILE,h:6*TILE, type:'portal', label:'→ 去图书馆', desc:'穿过走廊前往图书馆和自习区。', action:'join', room:'library'},
    ]
  },
  meeting_hall: {
    name: '大会议室',
    id: 'meeting_hall',
    buildMap: buildMeetingHall,
    spawn: {x:5*TILE+TILE/2, y:10*TILE+TILE/2},
    zones: [
      {x:8*TILE,y:5*TILE,w:12*TILE,h:6*TILE, type:'meeting', label:'毕业答辩会', desc:'研三学长正在进行论文答辩。', action:'call'},
      {x:22*TILE,y:4*TILE,w:6*TILE,h:6*TILE, type:'portal', label:'→ 回大厅', desc:'返回软院大厅。', action:'join', room:'lobby'},
    ]
  },
  lab: {
    name: '软件工程实验室',
    id: 'lab',
    buildMap: buildLab,
    spawn: {x:8*TILE+TILE/2, y:16*TILE+TILE/2},
    zones: [
      {x:4*TILE,y:6*TILE,w:8*TILE,h:6*TILE, type:'lab', label:'AI4SE 项目组', desc:'李博士正在演示自动代码修复系统。', action:'call'},
      {x:22*TILE,y:8*TILE,w:6*TILE,h:6*TILE, type:'portal', label:'→ 回大厅', desc:'返回软院大厅。', action:'join', room:'lobby'},
    ]
  },
  library: {
    name: '图书馆自习区',
    id: 'library',
    buildMap: buildLibrary,
    spawn: {x:6*TILE+TILE/2, y:14*TILE+TILE/2},
    zones: [
      {x:22*TILE,y:4*TILE,w:6*TILE,h:6*TILE, type:'portal', label:'→ 回大厅', desc:'返回软院大厅。', action:'join', room:'lobby'},
    ]
  }
};

// --- Map building functions ---
const ground = (map,x,y,w,h,c) => { for(let ty=y;ty<y+h;ty++) for(let tx=x;tx<x+w;tx++) if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){ const i=ty*COLS+tx; map[i]={type:'floor',color:c||'#e8dcc8'}; } };
const wall = (map,x,y,w,h) => { for(let ty=y;ty<y+h;ty++) for(let tx=x;tx<x+w;tx++) if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){ const i=ty*COLS+tx; map[i]={type:'wall',color:'#5a5a6e'}; } };
const carpet = (map,x,y,w,h,c) => { for(let ty=y;ty<y+h;ty++) for(let tx=x;tx<x+w;tx++) if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){ const i=ty*COLS+tx; map[i]={type:'carpet',color:c||'#c4a882'}; } };
const desk = (map,x,y,w,h) => { for(let ty=y;ty<y+h;ty++) for(let tx=x;tx<x+w;tx++) if(tx>=0&&ty>=0&&tx<COLS&&ty<ROWS){ const i=ty*COLS+tx; map[i]={type:'desk',color:'#8b7355'}; } };
const plant = (map,x,y) => { if(x>=0&&y>=0&&x<COLS&&y<ROWS) map[y*COLS+x]={type:'plant',color:'#4f9d62'}; };

function buildLobby(map) {
  ground(map,0,0,COLS,ROWS,'#e8dcc8');
  carpet(map,2,10,14,10,'#c4a882');
  carpet(map,22,4,14,20,'#c4a882');
  // Walls
  wall(map,0,0,COLS,1); wall(map,0,ROWS-1,COLS,1);
  wall(map,0,0,1,ROWS); wall(map,COLS-1,0,1,ROWS);
  // Inner walls - meeting room
  wall(map,2,11,1,6); wall(map,2,11,12,1); wall(map,14,11,1,6);
  // Inner walls - lab area
  wall(map,22,6,1,6); wall(map,22,6,10,1); wall(map,32,6,1,6);
  // Inner walls - innovation lab
  wall(map,20,17,1,8); wall(map,20,17,9,1); wall(map,29,17,1,8);
  // Desks in meeting room
  desk(map,5,13,6,2);
  // Desks in lab
  desk(map,25,8,4,2);
  // Plants
  plant(map,1,3); plant(map,38,3); plant(map,1,26); plant(map,38,26);
  plant(map,34,10); plant(map,16,20); plant(map,30,20);
}

function buildMeetingHall(map) {
  ground(map,0,0,COLS,ROWS,'#d8d0c0');
  carpet(map,6,4,20,12,'#8b4513');
  wall(map,0,0,COLS,1); wall(map,0,ROWS-1,COLS,1);
  wall(map,0,0,1,ROWS); wall(map,COLS-1,0,1,ROWS);
  wall(map,6,4,1,12); wall(map,6,4,20,1); wall(map,6,16,20,1); wall(map,26,4,1,12);
  desk(map,10,8,12,3);
  plant(map,1,3); plant(map,38,3);
}

function buildLab(map) {
  ground(map,0,0,COLS,ROWS,'#e0ddd0');
  carpet(map,2,4,18,14,'#556b6f');
  carpet(map,22,4,14,14,'#556b6f');
  wall(map,0,0,COLS,1); wall(map,0,ROWS-1,COLS,1);
  wall(map,0,0,1,ROWS); wall(map,COLS-1,0,1,ROWS);
  desk(map,5,8,6,2); desk(map,5,13,6,2);
  desk(map,25,8,6,2); desk(map,25,13,6,2);
  plant(map,1,3); plant(map,38,3); plant(map,12,2); plant(map,20,2);
}

function buildLibrary(map) {
  ground(map,0,0,COLS,ROWS,'#f0ead8');
  carpet(map,2,2,34,22,'#3a5a4a');
  wall(map,0,0,COLS,1); wall(map,0,ROWS-1,COLS,1);
  wall(map,0,0,1,ROWS); wall(map,COLS-1,0,1,ROWS);
  // Bookshelves
  for(let r=5;r<20;r+=3) wall(map,4,r,1,2);
  for(let r=5;r<20;r+=3) wall(map,8,r,1,2);
  for(let r=5;r<20;r+=3) wall(map,12,r,1,2);
  desk(map,16,8,8,2); desk(map,16,14,8,2);
  desk(map,28,8,6,2); desk(map,28,14,6,2);
  plant(map,1,3); plant(map,38,3);
}

// --- Game State ---
let currentRoom = 'lobby';
let playerX, playerY, playerDir = 1;
let tilemap = new Array(COLS*ROWS);
let keys = {};
let activeZone = null;
let nearbyNpc = null;

// NPCs
const npcs = {
  lobby: [
    {x:7*TILE+TILE/2, y:18*TILE+TILE/2, color:'#7258d9', name:'张教授', role:'软院导师',
     bubble:'同学们这学期的软工大作业质量很高。',
     dialogues:[
       {q:'科研方向怎么选？', a:'从大二开始进实验室体验，软院方向很广：软件工程、AI、系统、网络——先多听组会。'},
       {q:'本科生能进实验室吗？', a:'当然能。关键是找到愿意带本科生的导师，带着问题去学比被动上课好得多。'},
     ]},
    {x:28*TILE+TILE/2, y:10*TILE+TILE/2, color:'#ef6d8f', name:'同学小周', role:'大三软院',
     bubble:'终于交了软工大作业，通了两天宵。',
     dialogues:[
       {q:'软工大作业怎么做？', a:'找靠谱队友最重要。前端、后端、文档分工要明确，一个人扛全部会崩。'},
       {q:'有什么课推荐？', a:'操作系统和编译原理是硬课，但学完确实不一样。软工课设工作量最大但收获也最多。'},
     ]},
    {x:16*TILE+TILE/2, y:8*TILE+TILE/2, color:'#39a3c8', name:'学长阿杰', role:'研二·分布式系统',
     bubble:'我正在赶论文，这周组会刚过。',
     dialogues:[
       {q:'研究生日常是怎样的？', a:'看论文、做实验、写代码、开组会。跟本科最大的区别是没人push你——自己驱动自己。'},
       {q:'论文好发吗？', a:'找到好课题就成功了一半。南大软院CCF-B以上不算难，关键看导师指导和实验室积累。'},
     ]},
  ],
  meeting_hall: [
    {x:14*TILE+TILE/2, y:12*TILE+TILE/2, color:'#d69a35', name:'答辩秘书', role:'研三',
     bubble:'下一位答辩同学请准备。',
     dialogues:[
       {q:'答辩要注意什么？', a:'PPT控制在15页以内，重点讲清楚motivation和contribution。致谢页别忘了导师。'},
     ]},
  ],
  lab: [
    {x:8*TILE+TILE/2, y:10*TILE+TILE/2, color:'#4f9d62', name:'李博士', role:'博士后·AI4SE',
     bubble:'AI4SE用AI技术改进软件开发过程。',
     dialogues:[
       {q:'AI4SE是什么方向？', a:'用AI技术改进软件开发——自动修bug、代码生成、测试生成。软院做这个天然有优势。'},
       {q:'第一篇论文怎么开始', a:'先精读导师给的10篇核心论文，复现baseline，在复现中找到改进点。'},
     ]},
  ],
  library: [
    {x:12*TILE+TILE/2, y:10*TILE+TILE/2, color:'#b7664d', name:'图书馆阿姨', role:'管理员',
     bubble:'自习区请保持安静~',
     dialogues:[
       {q:'开馆时间？', a:'早上8点到晚上10点半。考试周延长到11点。'},
     ]},
  ],
};

// --- Rendering ---
function drawTile(x,y,tile) {
  const px = x*TILE, py = y*TILE;
  if (!tile) return;
  switch(tile.type) {
    case 'floor': ctx.fillStyle=tile.color; ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.05)'; ctx.strokeRect(px,py,TILE,TILE); break;
    case 'carpet': ctx.fillStyle=tile.color; ctx.fillRect(px,py,TILE,TILE);
      // Carpet pattern
      ctx.fillStyle='rgba(255,255,255,0.1)';
      for(let i=0;i<TILE;i+=8) ctx.fillRect(px+i,py,TILE/4,TILE/4);
      ctx.fillRect(px+TILE/4,py+TILE/4,TILE/4,TILE/4);
      ctx.fillRect(px+3*TILE/4,py+3*TILE/4,TILE/4,TILE/4);
      break;
    case 'wall':
      ctx.fillStyle=tile.color; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(px,py,TILE,TILE/4);
      ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(px,py+3*TILE/4,TILE,TILE/4);
      break;
    case 'desk':
      ctx.fillStyle=tile.color; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.fillRect(px+2,py+2,TILE-4,TILE/3);
      ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(px+2,py+TILE/2,TILE-4,TILE/4);
      break;
    case 'plant':
      ctx.fillStyle='#e8dcc8'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#4f9d62'; ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,TILE/3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#3a7d4a'; ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,TILE/5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#8b6914'; ctx.fillRect(px+TILE/2-2,py+TILE/2+TILE/4,4,TILE/4);
      break;
  }
}

function drawNpc(npc, camX, camY) {
  const sx = npc.x - camX, sy = npc.y - camY;
  if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) return;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(sx,sy+6,8,4,0,0,Math.PI*2); ctx.fill();
  // Body
  ctx.fillStyle = npc.color; ctx.beginPath(); ctx.arc(sx,sy-4,7,0,Math.PI*2); ctx.fill();
  // Face
  ctx.fillStyle = '#f3d2b6'; ctx.beginPath(); ctx.arc(sx,sy-4,5,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle = '#222'; ctx.fillRect(sx-3,sy-6,2,2); ctx.fillRect(sx+1,sy-6,2,2);
  // Smile
  ctx.strokeStyle = '#222'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(sx,sy-3,2,0,Math.PI); ctx.stroke();
  // Name tag
  ctx.fillStyle = '#fff'; ctx.font = '9px Microsoft YaHei'; ctx.textAlign='center';
  ctx.fillText(npc.name, sx, sy-18);
  // Bubble if nearby
  if (nearbyNpc === npc) {
    const bw = ctx.measureText(npc.bubble).width + 12;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.roundRect(sx-bw/2,sy-42,bw,22,6); ctx.fill();
    ctx.fillStyle = '#222'; ctx.font = '10px Microsoft YaHei';
    ctx.fillText(npc.bubble, sx, sy-28);
  }
}

function drawPlayer(camX, camY, time) {
  const sx = playerX - camX, sy = playerY - camY;
  const bob = Math.sin(time/200)*2;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(sx,sy+8,9,5,0,0,Math.PI*2); ctx.fill();
  // Body
  ctx.fillStyle = '#7258d9'; ctx.beginPath(); ctx.arc(sx,sy-6,9,0,Math.PI*2); ctx.fill();
  // Body lower
  ctx.fillStyle = '#315069'; ctx.fillRect(sx-6,sy+2,12,8);
  // Face
  ctx.fillStyle = '#f3d2b6'; ctx.beginPath(); ctx.arc(sx,sy-6,7,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle = '#222';
  if (playerDir >= 0) { ctx.fillRect(sx-4,sy-9,3,3); ctx.fillRect(sx+1,sy-9,3,3); }
  else { ctx.fillRect(sx+2,sy-9,3,3); ctx.fillRect(sx-4,sy-9,3,3); }
  // Hair
  ctx.fillStyle = '#2c2448'; ctx.beginPath(); ctx.arc(sx,sy-10,6,Math.PI,0); ctx.fill();
  // Player indicator
  ctx.fillStyle = '#fff1a5'; ctx.font = 'bold 10px Microsoft YaHei'; ctx.textAlign='center';
  ctx.fillText('我', sx, sy-24);
  // Highlight circle
  ctx.strokeStyle = 'rgba(255,241,165,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy-2,14,0,Math.PI*2); ctx.stroke();
}

function drawZone(zone, camX, camY, time) {
  let color, alpha;
  switch(zone.type) {
    case 'meeting': color='#d69a35'; alpha=0.12; break;
    case 'lab': color='#39a3c8'; alpha=0.12; break;
    case 'classroom': color='#7258d9'; alpha=0.12; break;
    case 'portal': color='#4f9d62'; alpha=0.12; break;
    default: color='#aaa'; alpha=0.08; break;
  }
  const pulse = activeZone === zone ? Math.sin(time/200)*0.06 : 0;
  ctx.fillStyle = color.replace(')', `,${alpha+pulse})`).replace('rgb','rgba');
  if (color.startsWith('#')) ctx.fillStyle = color + '1e';
  ctx.fillRect(zone.x-camX, zone.y-camY, zone.w, zone.h);
  // Border
  ctx.strokeStyle = activeZone===zone ? '#fff1a5' : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = activeZone===zone ? 3 : 1;
  ctx.setLineDash(activeZone===zone ? [] : [6,4]);
  ctx.strokeRect(zone.x-camX, zone.y-camY, zone.w, zone.h);
  ctx.setLineDash([]);
  // Label
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Microsoft YaHei'; ctx.textAlign='center';
  ctx.fillText(zone.label, zone.x+zone.w/2-camX, zone.y-camY-6);
  // Icon
  const iconMap = {meeting:'🎤',lab:'💻',classroom:'🎓',portal:'🚪'};
  ctx.font = '16px sans-serif'; ctx.fillText(iconMap[zone.type]||'📍', zone.x+zone.w/2-camX, zone.y+zone.h/2-camY+6);
}

// --- Game Logic ---
function loadRoom(roomId) {
  currentRoom = roomId;
  const room = ROOMS[roomId];
  tilemap = new Array(COLS*ROWS).fill(null);
  room.buildMap(tilemap);
  document.getElementById('room-name').textContent = '📍 ' + room.name;
}

function isSolid(x, y) {
  const tx = Math.floor(x/TILE), ty = Math.floor(y/TILE);
  if (tx<0||ty<0||tx>=COLS||ty>=ROWS) return true;
  const tile = tilemap[ty*COLS+tx];
  return tile && (tile.type==='wall'||tile.type==='desk');
}

function findNearbyZone() {
  const room = ROOMS[currentRoom];
  for (const zone of room.zones) {
    if (playerX > zone.x && playerX < zone.x+zone.w && playerY > zone.y && playerY < zone.y+zone.h) return zone;
  }
  return null;
}

function findNearbyNpc() {
  const roomNpcs = npcs[currentRoom] || [];
  for (const npc of roomNpcs) {
    const dist = Math.hypot(playerX-npc.x, playerY-npc.y);
    if (dist < 60) return npc;
  }
  return null;
}

function enterZone(zone) {
  if (zone.action === 'join' && zone.room) {
    document.getElementById('overlay').classList.add('visible');
    document.getElementById('overlay-title').textContent = ROOMS[zone.room].name;
    setTimeout(() => {
      loadRoom(zone.room);
      const spawn = ROOMS[zone.room].spawn;
      playerX = spawn.x; playerY = spawn.y;
      document.getElementById('overlay').classList.remove('visible');
    }, 600);
  } else if (zone.action === 'call') {
    document.getElementById('status-text').textContent = '🔴 正在加入视频会议: ' + zone.label;
    setTimeout(() => document.getElementById('status-text').textContent = '', 3000);
  }
}

// --- Main Loop ---
let lastTime = 0;
function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(50, time - lastTime || 16);
  lastTime = time;
  update(dt, time);
  render(time);
}

function update(dt, time) {
  // Movement
  let dx=0, dy=0;
  if (keys.ArrowLeft||keys.KeyA) dx=-1;
  if (keys.ArrowRight||keys.KeyD) dx=1;
  if (keys.ArrowUp||keys.KeyW) dy=-1;
  if (keys.ArrowDown||keys.KeyS) dy=1;
  if (dx||dy) {
    const len = Math.hypot(dx,dy)||1;
    const speed = 160;
    const mx = dx/len * speed * dt/1000;
    const my = dy/len * speed * dt/1000;
    if (!isSolid(playerX+mx, playerY)) playerX += mx;
    if (!isSolid(playerX, playerY+my)) playerY += my;
    if (dx) playerDir = dx;
  }
  playerX = Math.max(TILE/2, Math.min(MAP_W-TILE/2, playerX));
  playerY = Math.max(TILE/2, Math.min(MAP_H-TILE/2, playerY));

  // Check proximity
  activeZone = findNearbyZone();
  nearbyNpc = findNearbyNpc();

  // Update popup
  const popup = document.getElementById('proximity-popup');
  if (activeZone && activeZone !== lastActiveZone) {
    document.getElementById('popup-title').textContent = activeZone.label;
    document.getElementById('popup-desc').textContent = activeZone.desc;
    let actionHtml = '';
    if (activeZone.action === 'join') actionHtml = `<button class="btn-enter" onclick="enterZone(activeZone)">进入</button>`;
    else if (activeZone.action === 'call') actionHtml = `<button class="btn-call" onclick="enterZone(activeZone)">加入视频</button>`;
    document.getElementById('popup-actions').innerHTML = actionHtml;
    popup.classList.add('visible');
  } else if (!activeZone) {
    popup.classList.remove('visible');
  }
  lastActiveZone = activeZone;

  // NPC dialogue popup
  if (nearbyNpc && nearbyNpc !== lastNearbyNpc) {
    document.getElementById('status-text').textContent = '💬 按 E 与 ' + nearbyNpc.name + ' 对话';
  } else if (!nearbyNpc) {
    if (document.getElementById('status-text').textContent.startsWith('💬'))
      document.getElementById('status-text').textContent = '';
  }
  lastNearbyNpc = nearbyNpc;
}

let lastActiveZone = null, lastNearbyNpc = null;
let dialogueIndex = 0;

function render(time) {
  W = canvas.width = canvas.parentElement.clientWidth;
  H = canvas.height = canvas.parentElement.clientHeight;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.imageSmoothingEnabled = false;

  const camX = playerX - W/2, camY = playerY - H/2;
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,W,H);

  // Draw visible tiles
  const startTX = Math.max(0, Math.floor(camX/TILE)-1);
  const startTY = Math.max(0, Math.floor(camY/TILE)-1);
  const endTX = Math.min(COLS-1, Math.ceil((camX+W)/TILE)+1);
  const endTY = Math.min(ROWS-1, Math.ceil((camY+H)/TILE)+1);

  for (let ty=startTY; ty<=endTY; ty++) {
    for (let tx=startTX; tx<=endTX; tx++) {
      const tile = tilemap[ty*COLS+tx];
      if (tile) drawTile(tx, ty, tile);
    }
  }

  // Draw zones
  const room = ROOMS[currentRoom];
  room.zones.forEach(z => drawZone(z, camX, camY, time));

  // Draw NPCs
  (npcs[currentRoom]||[]).forEach(n => drawNpc(n, camX, camY));

  // Draw player
  drawPlayer(camX, camY, time);

  // Minimap
  if (minimapVisible && miniCanvas.parentElement.style.display !== 'none') {
    miniCanvas.width = 140; miniCanvas.height = 100;
    miniCtx.fillStyle = 'rgba(0,0,0,0.8)'; miniCtx.fillRect(0,0,140,100);
    const sx = 140/MAP_W, sy = 100/MAP_H;
    for (let ty=0; ty<ROWS; ty++) {
      for (let tx=0; tx<COLS; tx++) {
        const tile = tilemap[ty*COLS+tx];
        if (!tile) continue;
        if (tile.type==='wall') miniCtx.fillStyle='#666';
        else if (tile.type==='carpet') miniCtx.fillStyle='#8b7355';
        else if (tile.type==='desk') miniCtx.fillStyle='#8b6914';
        else miniCtx.fillStyle='#ddd';
        miniCtx.fillRect(tx*TILE*sx, ty*TILE*sy, TILE*sx+1, TILE*sy+1);
      }
    }
    // NPCs
    (npcs[currentRoom]||[]).forEach(n => { miniCtx.fillStyle=n.color; miniCtx.fillRect(n.x*sx-1,n.y*sy-1,3,3); });
    // Player
    miniCtx.fillStyle='#fff1a5'; miniCtx.fillRect(playerX*sx-2,playerY*sy-2,4,4);
    miniCtx.strokeStyle='#fff'; miniCtx.strokeRect(playerX*sx-2,playerY*sy-2,4,4);
    // Zones
    room.zones.forEach(z => { miniCtx.strokeStyle='#fff1a5'; miniCtx.strokeRect(z.x*sx,z.y*sy,z.w*sx,z.h*sy); });
  }
}

// --- Input ---
window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code==='KeyE') interactNpc(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length===1) { touchStart={x:e.touches[0].clientX, y:e.touches[0].clientY}; }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
    keys.ArrowUp = dy < -10; keys.ArrowDown = dy > 10;
    keys.ArrowLeft = dx < -10; keys.ArrowRight = dx > 10;
  }
}, {passive:false});
canvas.addEventListener('touchend', () => {
  touchStart=null; keys.ArrowUp=keys.ArrowDown=keys.ArrowLeft=keys.ArrowRight=false;
});

// Click to move
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left + (playerX - W/2);
  const cy = e.clientY - rect.top + (playerY - H/2);
  // Check if clicking on a zone
  const room = ROOMS[currentRoom];
  for (const zone of room.zones) {
    if (cx > zone.x && cx < zone.x+zone.w && cy > zone.y && cy < zone.y+zone.h) {
      enterZone(zone); return;
    }
  }
  // Check if clicking on NPC
  for (const npc of (npcs[currentRoom]||[])) {
    if (Math.hypot(cx-npc.x, cy-npc.y) < 30) { interactNpc(npc); return; }
  }
});

// --- NPC Interaction ---
function interactNpc(target) {
  const npc = target || nearbyNpc;
  if (!npc || !npc.dialogues) return;
  const d = npc.dialogues[dialogueIndex % npc.dialogues.length];
  document.getElementById('status-text').textContent = npc.name + ': ' + d.a;
  dialogueIndex++;
  setTimeout(() => { if (document.getElementById('status-text').textContent===npc.name+': '+d.a) document.getElementById('status-text').textContent=''; }, 5000);
}

// --- UI Functions ---
function toggleMinimap() {
  minimapVisible = !minimapVisible;
  document.getElementById('minimap').style.display = minimapVisible ? 'block' : 'none';
}
function resetPosition() {
  const spawn = ROOMS[currentRoom].spawn; playerX=spawn.x; playerY=spawn.y;
}

// --- Init ---
function init() {
  loadRoom('lobby');
  const spawn = ROOMS.lobby.spawn;
  playerX = spawn.x; playerY = spawn.y;

  const resizeCanvas = () => {
    W = canvas.parentElement.clientWidth;
    H = canvas.parentElement.clientHeight;
    canvas.width = W; canvas.height = H;
  };
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Simulated online users
  const count = 8 + Math.floor(Math.random()*8);
  document.getElementById('online-count').textContent = count + ' 人在线';

  requestAnimationFrame(gameLoop);
}

init();
</script>
